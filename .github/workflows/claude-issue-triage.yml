name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (Tetris en JavaScript vanilla, ver CLAUDE.md para la arquitectura de game.js: board model, piezas/rotación, wall kicks, game loop, line clearing/scoring, ghost piece, rendering).

            1. Lee el título y cuerpo del issue con `gh issue view ${{ github.event.issue.number }}`.
            2. Determina qué etiquetas existentes aplican (solo puedes usar labels ya creadas en el repo: bug, enhancement, documentation, duplicate, "good first issue", "help wanted", invalid, question, wontfix, accessibility) y asígnalas con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`. No crees labels nuevas. Si el issue no tiene suficiente información, considera la label "invalid" o "question" según corresponda.
            3. Publica UN comentario en el issue (`gh issue comment ${{ github.event.issue.number }} --body "..."`) con un diagnóstico técnico en español, estructurado así:
               - **Diagnóstico**: resumen del problema o solicitud.
               - **Área afectada**: qué parte de game.js/index.html/style.css está probablemente involucrada (nombra funciones/variables concretas de CLAUDE.md cuando aplique, p.ej. `collide`, `tryRotate`, `clearLines`, `loop`, `ghostY`, `draw`).
               - **Causa probable** (si es un bug) o **Alcance sugerido** (si es un enhancement): hipótesis concreta y verificable, no genérica.
               - **Próximos pasos sugeridos**: pasos concretos para implementar el fix/feature.
            4. No modifiques código ni abras PRs — esta tarea es solo de clasificación y diagnóstico.
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"'
